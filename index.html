<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Мини-Майнкрафт — воксельная игра</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235db53c'/><rect y='10' width='16' height='6' fill='%238a5a2b'/></svg>" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#87ceeb; font-family: 'Segoe UI', system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #crosshair { position:fixed; left:50%; top:50%; width:20px; height:20px; transform:translate(-50%,-50%); pointer-events:none; z-index:10; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,.9); box-shadow:0 0 2px #000; }
  #crosshair::before { left:9px; top:2px; width:2px; height:16px; }
  #crosshair::after { left:2px; top:9px; width:16px; height:2px; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.65); z-index:20; color:#fff; text-align:center; padding:20px; }
  #overlay.hidden { display:none; }
  .panel { background:#2b2b2b; border:4px solid #111; outline:3px solid #555; padding:28px 32px; max-width:560px; border-radius:4px; }
  .panel h1 { font-size:28px; margin-bottom:12px; color:#7CFC00; text-shadow:2px 2px 0 #222; }
  .panel p { font-size:14px; line-height:1.6; color:#ddd; margin:6px 0; }
  .panel kbd { background:#111; border:1px solid #555; border-bottom-width:3px; padding:1px 7px; border-radius:4px; font-size:12px; }
  #playBtn { margin-top:16px; font-size:18px; padding:12px 32px; background:#5db53c; border:3px solid #2f6b1e; border-bottom-width:5px; color:#fff; cursor:pointer; border-radius:4px; font-weight:bold; }
  #playBtn:hover { background:#6cc54a; }
  #hotbar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:10; }
  .slot { width:56px; height:56px; border:3px solid #555; background:rgba(0,0,0,.55); border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-size:10px; cursor:pointer; user-select:none; }
  .slot .swatch { width:28px; height:28px; border:2px solid rgba(255,255,255,.6); margin-bottom:2px; image-rendering:pixelated; }
  .slot.active { border-color:#fff; box-shadow:0 0 10px #fff; }
  #info { position:fixed; top:10px; left:10px; z-index:10; background:rgba(0,0,0,.5); color:#fff; padding:8px 12px; border-radius:4px; font-size:12px; line-height:1.5; }
  #target { position:fixed; top:10px; right:10px; z-index:10; background:rgba(0,0,0,.5); color:#ffd75e; padding:8px 12px; border-radius:4px; font-size:12px; }
  #scene-ready { position:fixed; bottom:12px; right:12px; z-index:10; background:rgba(0,128,0,.8); color:#fff; font-size:11px; padding:4px 8px; border-radius:4px; display:none; }
  #err { position:fixed; bottom:12px; left:12px; z-index:30; background:#a00; color:#fff; font-size:12px; padding:8px 12px; border-radius:4px; display:none; max-width:40ch; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="crosshair"></div>
<div id="info">WASD — движение · Space — прыжок · ЛКМ — сломать · ПКМ — поставить · 1–6 — блок<br>Позиция: <span id="pos">—</span></div>
<div id="target">Прицел: —</div>
<div id="hotbar"></div>
<div id="scene-ready">SCENE READY</div>
<div id="err"></div>
<div id="overlay">
  <div class="panel">
    <h1>⛏ МИНИ-МАЙНКРАФТ</h1>
    <p>Мир из блоков 32×32. Гуляй, строй и ломай!</p>
    <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — движение · <kbd>Space</kbd> — прыжок · мышь — осмотр</p>
    <p><b>ЛКМ</b> — разрушить блок · <b>ПКМ</b> — установить блок · <b>1–6</b> — выбор блока</p>
    <button id="playBtn">ИГРАТЬ</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

const errBox = document.getElementById('err');
function showErr(m){ errBox.style.display='block'; errBox.textContent=m; }

// ---------- World data ----------
const W = 32, D = 32;
const voxels = new Map(); // "x,y,z" -> type
const key = (x,y,z)=>x+','+y+','+z;
const BLOCKS = {
  1:{ name:'Трава',  color:'#5db53c' },
  2:{ name:'Земля',  color:'#8a5a2b' },
  3:{ name:'Камень', color:'#8d8d8d' },
  4:{ name:'Дерево', color:'#6b4a2a' },
  5:{ name:'Листва', color:'#2f9e3e' },
  6:{ name:'Песок',  color:'#e3d89a' },
};
let selected = 1;

function heightAt(x,z){
  return 2 + Math.round(1.4*Math.sin(x*0.45)*Math.cos(z*0.4) + 0.8*Math.sin(x*0.2+z*0.3));
}
function genWorld(){
  voxels.clear();
  for(let x=0;x<W;x++) for(let z=0;z<D;z++){
    const h = heightAt(x,z);
    for(let y=0;y<=h;y++){
      let t = 2;
      if(y===h) t = 1;
      else if(y>=h-1) t = 2;
      else t = 3;
      // песчаная зона в углу
      if(x>24 && z>24 && y>=h-1) t = 6;
      voxels.set(key(x,y,z), t);
    }
    voxels.set(key(x,0,z), 3); // bedrock-ish пол
  }
  // деревья
  const trees=[[8,8],[20,10],[12,22],[24,18],[6,24]];
  for(const [tx,tz] of trees){
    const h = heightAt(tx,tz);
    for(let i=1;i<=4;i++) voxels.set(key(tx,h+i,tz),4);
    for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++) for(let dy=0;dy<2;dy++){
      if(Math.abs(dx)===2&&Math.abs(dz)===2) continue;
      const p=key(tx+dx,h+4+dy,tz+dz);
      if(!voxels.has(p)) voxels.set(p,5);
    }
    voxels.set(key(tx,h+6,tz),5);
  }
}

// ---------- Three setup ----------
let renderer, scene, camera, meshes={};
const app = document.getElementById('app');

function pixelTexture(hex){
  const c=document.createElement('canvas'); c.width=c.height=16;
  const g=c.getContext('2d');
  const base=new THREE.Color(hex);
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){
    const n=(Math.sin(x*12.9898+y*78.233)*43758.5453)%1;
    const v=(Math.abs(n)*0.16)-0.08;
    const col=base.clone().offsetHSL(0,(Math.abs(n)*0.1)-0.05,v);
    g.fillStyle='#'+col.getHexString();
    g.fillRect(x,y,1,1);
  }
  // кирпичная сетка для травы сверху — светлее
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

function buildMeshes(){
  for(const m of Object.values(meshes)){ scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  meshes={};
  const geo=new THREE.BoxGeometry(1,1,1);
  const byType=new Map();
  for(const [k,t] of voxels){
    if(!byType.has(t)) byType.set(t,[]);
    byType.get(t).push(k);
  }
  for(const [t,keys] of byType){
    const mat=new THREE.MeshLambertMaterial({ map: pixelTexture(BLOCKS[t].color) });
    const im=new THREE.InstancedMesh(geo.clone(),mat,keys.length);
    const d=new THREE.Object3D();
    keys.forEach((k,i)=>{
      const [x,y,z]=k.split(',').map(Number);
      d.position.set(x+0.5,y+0.5,z+0.5);
      d.updateMatrix();
      im.setMatrixAt(i,d.matrix);
    });
    im.instanceMatrix.needsUpdate=true;
    im.userData.keys=keys;
    scene.add(im);
    meshes[t]=im;
  }
}

function init(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  app.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x87ceeb);
  scene.fog=new THREE.Fog(0x87ceeb,30,90);
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,200);
  camera.position.set(16,8,20);
  scene.add(new THREE.HemisphereLight(0xffffff,0x557755,0.9));
  const sun=new THREE.DirectionalLight(0xffffff,1.1);
  sun.position.set(30,50,20);
  scene.add(sun);
  genWorld();
  buildMeshes();
  buildHotbar();
  addDebugBox();
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

let debugBox;
function addDebugBox(){
  debugBox=new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002,1.002,1.002)),
    new THREE.LineBasicMaterial({color:0x000000}));
  debugBox.visible=false;
  scene.add(debugBox);
}

// ---------- Player physics ----------
const player={ pos:new THREE.Vector3(16.5,10,24.5), vel:new THREE.Vector3(), yaw:Math.PI, pitch:-0.2, onGround:false };
const P_W=0.3, P_H=1.8, EYE=1.62;
const keysDown={};

function solidAt(x,y,z){
  return voxels.has(key(Math.floor(x),Math.floor(y),Math.floor(z)));
}
function collides(px,py,pz){
  const x0=px-P_W,x1=px+P_W, y0=py,y1=py+P_H, z0=pz-P_W,z1=pz+P_W;
  for(let x=Math.floor(x0);x<=Math.floor(x1);x++)
    for(let y=Math.floor(y0);y<=Math.floor(y1);y++)
      for(let z=Math.floor(z0);z<=Math.floor(z1);z++)
        if(voxels.has(key(x,y,z))) return true;
  return false;
}
function moveAxis(axis,amt){
  const p=player.pos.clone();
  if(axis==='x')p.x+=amt; if(axis==='y')p.y+=amt; if(axis==='z')p.z+=amt;
  if(!collides(p.x,p.y,p.z)){ player.pos.copy(p); return true; }
  if(axis==='y'){ player.vel.y=0; if(amt<0) player.onGround=true; }
  return false;
}

function update(dt){
  const speed=player.onGround?5.5:4.2;
  const f=(keysDown['KeyW']?1:0)-(keysDown['KeyS']?1:0);
  const s=(keysDown['KeyD']?1:0)-(keysDown['KeyA']?1:0);
  const sin=Math.sin(player.yaw), cos=Math.cos(player.yaw);
  let mx=(-sin*f+cos*s)*speed*dt;
  let mz=(-cos*f-sin*s)*speed*dt;
  player.vel.y-=25*dt;
  if(player.vel.y<-18)player.vel.y=-18;
  player.onGround=false;
  moveAxis('x',mx);
  moveAxis('z',mz);
  moveAxis('y',player.vel.y*dt);
  if(player.pos.y<-10){ player.pos.set(16.5,10,24.5); player.vel.set(0,0,0); }
  camera.position.set(player.pos.x,player.pos.y+EYE,player.pos.z);
  camera.rotation.order='YXZ';
  camera.rotation.y=player.yaw;
  camera.rotation.x=player.pitch;
  document.getElementById('pos').textContent=
    player.pos.x.toFixed(1)+', '+player.pos.y.toFixed(1)+', '+player.pos.z.toFixed(1);
}

// ---------- picking (DDA) ----------
function eyeDir(){
  const d=new THREE.Vector3(0,0,-1);
  d.applyEuler(camera.rotation);
  return d;
}
function pick(maxDist=7){
  const o=camera.position.clone(), dir=eyeDir();
  const step=0.1;
  let prev=null;
  for(let t=0;t<maxDist;t+=step){
    const p=o.clone().addScaledVector(dir,t);
    const bx=Math.floor(p.x),by=Math.floor(p.y),bz=Math.floor(p.z);
    const k=key(bx,by,bz);
    if(voxels.has(k)) return {x:bx,y:by,z:bz,prev};
    prev={x:bx,y:by,z:bz};
  }
  return null;
}
function breakBlock(){
  const hit=pick();
  if(!hit) return;
  if(hit.y<=0) return; // не ломаем пол
  voxels.delete(key(hit.x,hit.y,hit.z));
  buildMeshes();
}
function placeBlock(){
  const hit=pick();
  if(!hit||!hit.prev) return;
  const {x,y,z}=hit.prev;
  if(x<0||y<0||z<0||x>=W||y>40||z>=D) return;
  // не ставить внутрь игрока
  const px=player.pos;
  if(x===Math.floor(px.x)&&z===Math.floor(px.z)&&(y===Math.floor(px.y)||y===Math.floor(px.y+1))) return;
  voxels.set(key(x,y,z),selected);
  buildMeshes();
}

// ---------- input ----------
function bindInput(){
  addEventListener('keydown',e=>{
    keysDown[e.code]=true;
    if(e.code==='Space'){ if(player.onGround){player.vel.y=8.5;player.onGround=false;} e.preventDefault(); }
    if(e.code.startsWith('Digit')){
      const n=+e.code.slice(5);
      if(n>=1&&n<=6){selected=n;buildHotbar();}
    }
  });
  addEventListener('keyup',e=>keysDown[e.code]=false);
  const overlay=document.getElementById('overlay');
  const btn=document.getElementById('playBtn');
  btn.addEventListener('click',()=>{ renderer.domElement.requestPointerLock?.(); overlay.classList.add('hidden'); });
  overlay.addEventListener('click',()=>{ renderer.domElement.requestPointerLock?.(); overlay.classList.add('hidden'); });
  document.addEventListener('pointerlockchange',()=>{
    if(document.pointerLockElement!==renderer.domElement) overlay.classList.remove('hidden');
  });
  addEventListener('mousemove',e=>{
    if(document.pointerLockElement===renderer.domElement){
      player.yaw-=e.movementX*0.0025;
      player.pitch-=e.movementY*0.0025;
      player.pitch=Math.max(-1.55,Math.min(1.55,player.pitch));
    }
  });
  addEventListener('mousedown',e=>{
    if(document.pointerLockElement!==renderer.domElement) return;
    if(e.button===0) breakBlock();
    if(e.button===2) placeBlock();
  });
  addEventListener('contextmenu',e=>e.preventDefault());
}

function buildHotbar(){
  const hb=document.getElementById('hotbar'); hb.innerHTML='';
  for(let i=1;i<=6;i++){
    const d=document.createElement('div');
    d.className='slot'+(i===selected?' active':'');
    d.innerHTML=`<div class="swatch" style="background:${BLOCKS[i].color}"></div>${i} ${BLOCKS[i].name}`;
    d.onclick=()=>{selected=i;buildHotbar();};
    hb.appendChild(d);
  }
}

// ---------- loop ----------
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  update(dt);
  const hit=pick();
  const t=document.getElementById('target');
  if(hit){
    t.textContent=`Прицел: ${BLOCKS[voxels.get(key(hit.x,hit.y,hit.z))]?.name||'?'} (${hit.x},${hit.y},${hit.z})`;
    debugBox.visible=true;
    debugBox.position.set(hit.x+0.5,hit.y+0.5,hit.z+0.5);
  } else { t.textContent='Прицел: —'; debugBox.visible=false; }
  renderer.render(scene,camera);
  if(!window.__sceneReady){
    window.__sceneReady=true;
    document.body.dataset.sceneReady='true';
    document.getElementById('scene-ready').style.display='block';
  }
}

let clock;
try{
  init();
  bindInput();
  clock=new THREE.Clock();
  loop();
  // API для автотестов: ломание/установка/состояние мира
  window.__game={ voxels, key, player, pick, breakBlock, placeBlock,
    count:()=>voxels.size, setSelected:(n)=>{selected=n;buildHotbar();} };
}catch(err){
  console.error(err);
  showErr('Ошибка запуска: '+err.message);
}
</script>
</body>
</html>
